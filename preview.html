<style>
  :root {
    --card-background-color: #ffffff;
    --ha-card-background: #ffffff;
    --primary-text-color: #1b1d21;
    --secondary-text-color: #7c828b;
    --divider-color: rgba(0,0,0,.08);
    --secondary-background-color: #f2f3f5;
    --ha-card-border-radius: 18px;
  }
  body.dark {
    --card-background-color: #1c1d21;
    --ha-card-background: #232529;
    --primary-text-color: #f2f4f8;
    --secondary-text-color: #9aa1ab;
    --divider-color: rgba(255,255,255,.10);
    --secondary-background-color: #2c2f34;
  }
  body {
    margin: 0; min-height: 100vh;
    background: var(--secondary-background-color);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 36px 20px 60px; box-sizing: border-box;
    color: var(--primary-text-color);
  }
  .toolbar { display: flex; gap: 10px; align-items: center; font-size: 13px; opacity: .85; flex-wrap: wrap; justify-content: center; }
  .toolbar button, .toolbar a {
    border: 1px solid var(--divider-color); background: var(--ha-card-background);
    color: inherit; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    font-size: 13px; text-decoration: none;
  }
  .toolbar a.on { border-color: #1677d2; color: #1677d2; }
  .frame { width: 100%; max-width: 420px; }
  .caption { font-size: 12px; text-align: center; opacity: .6; margin-top: 6px; }
  body.plain { display: block; padding: 10px 0; gap: 0; }
  body.plain .toolbar, body.plain .caption, body.plain #tip { display: none !important; }
  body.plain .frame { max-width: 420px; margin: 0 auto; }
</style>
</head>

      卡片脚本没能加载：本页需要联网从 CDN 取 lit（或已安装 Home Assistant 时走内置 lit）。

  const zoom = parseFloat(qs.get("zoom") || "");
  if (zoom > 0) document.documentElement.style.zoom = String(zoom);

  customElements.whenDefined("cqsw-water-card").then(() => {
    const card = document.getElementById("card");
    card.setConfig({ entity: "sensor.cqsw_water_demo" });
    card.hass = {
      states,
      callService: (d, s, data) => console.log("callService", d, s, data),
    };
    const view = qs.get("view");
    if (view === "editor") {
      // 演示卡片编辑器 (可视化配置界面)
      card.hidden = true;
      const ed = document.createElement("cqsw-water-card-editor");
      card.parentNode.insertBefore(ed, card);
      ed.setConfig({ entity: "sensor.cqsw_water_demo" });
      ed.hass = {
        states,
        callWS: () => Promise.resolve([
          { entity_id: "sensor.cqsw_water_demo", platform: "cqsw_water" }
        ]),
      };
    } else if (view && view !== "main" && typeof card._go === "function") {
      card._go(view);
    }
  });

  document.getElementById("theme").addEventListener("click", () => {
    document.body.classList.toggle("dark");
  });
  const view = qs.get("view") || "main";
  const cur = document.getElementById("v-" + view);
  if (cur) cur.classList.add("on");

  setTimeout(() => {
    if (!customElements.get("cqsw-water-card")) {
      const tip = document.getElementById("tip");
      if (tip) tip.hidden = false;
    }
  }, 3000);
